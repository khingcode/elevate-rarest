<style>
/* Layout: one centred 640px "elevator shaft" column; floors (questions) stack inside it, results open onto the roof. */
:root {
  --bg: #000000;
  --panel: #0e0e0e;
  --line: #2a2a2a;
  --fg: #ffffff;
  --dim: #9b9b9b;
  --accent: #ef4b2b;
  --accent-ink: #000000;
  --bad: #ffb199;
  --display: "Archivo", "Arial Black", Impact, sans-serif;
  --body: "Archivo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  min-height: 100%;
}
.shaft { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* wordmark */
.wm {
  font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 125%;
  text-transform: uppercase; letter-spacing: -0.03em; line-height: .86; margin: 0;
  display: inline-flex; align-items: flex-end;
}
.wm .chev { height: .8em; width: .88em; margin: 0 .01em .02em .02em; fill: var(--accent); flex: none; transform: skewX(-9deg); }
.wm.sm { font-size: 22px; }
.wm.xl { font-size: clamp(56px, 18vw, 112px); }

header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 2px solid var(--fg); }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); text-align: right; }
.meta b { color: var(--fg); font-weight: 700; }

.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
h2.q { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 118%; text-transform: uppercase;
  font-size: clamp(30px, 8vw, 46px); line-height: .98; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lead { font-size: 18px; max-width: 46ch; color: #e6e6e6; }

/* buttons */
.btn { appearance: none; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 118%; text-transform: uppercase; letter-spacing: -0.01em;
  font-size: 20px; padding: 16px 28px; transform: skewX(-9deg); transition: background .12s, transform .12s; align-self: flex-start; }
.btn > span { display: inline-block; transform: skewX(9deg); }
.btn:hover { background: #fff; }
.btn:active { transform: skewX(-9deg) translateY(2px); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--fg); }
.btn.ghost:hover { background: var(--fg); color: #000; }
.btn[disabled] { opacity: .35; cursor: default; }

/* floors */
.floors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.floor { height: 40px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 14px; border: 2px solid var(--line); color: var(--dim); transform: skewX(-9deg); }
.floor > span { transform: skewX(9deg); }
.floor.done { background: var(--fg); color: #000; border-color: var(--fg); }
.floor.here { background: var(--accent); color: #000; border-color: var(--accent); }

/* answer input */
.ask { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; gap: 0; flex-wrap: wrap; }
.field input { flex: 1 1 240px; min-width: 0; background: var(--panel); border: 2px solid var(--fg); border-right: 0; padding: 16px; font-size: 20px; font-weight: 600; border-radius: 0; }
.field input::placeholder { color: #666; font-weight: 400; }
.field .btn { align-self: stretch; transform: none; padding-inline: 26px; }
.field .btn > span { transform: none; }
.field .btn:active { transform: translateY(2px); }
@media (max-width: 480px) { .field input { border-right: 2px solid var(--fg); } .field .btn { flex: 1 1 100%; } }
.note { min-height: 1.4em; color: var(--bad); font-size: 15px; }
.hint { color: var(--dim); font-size: 14px; }

/* reveal */
.reveal { display: flex; flex-direction: column; gap: 18px; }
.verdict { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 2px solid var(--fg); padding-top: 14px; }
.verdict .you { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 118%; font-size: 28px; text-transform: uppercase; letter-spacing: -.02em; overflow-wrap: anywhere; }
.pts { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
.pips { display: inline-flex; gap: 4px; margin-left: 10px; vertical-align: middle; }
.pips i { width: 14px; height: 8px; background: var(--line); transform: skewX(-9deg); }
.pips i.on { background: var(--accent); }
.tag { display: inline-block; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--fg); color: #000; padding: 3px 8px; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; }
.bars .nm { font-weight: 600; overflow-wrap: anywhere; }
.bars .pc { font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.bars .track { grid-column: 1 / -1; height: 10px; background: var(--panel); transform: skewX(-9deg); }
.bars .fill { height: 100%; background: #5a5a5a; }
.bars li.me .nm, .bars li.me .pc { color: var(--accent); }
.bars li.me .fill { background: var(--accent); }
.gap { color: var(--dim); font-family: var(--mono); letter-spacing: .3em; padding-left: 2px; }

/* results */
.score { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--fg); padding-top: 18px; }
.big { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 125%; font-size: clamp(72px, 22vw, 132px); line-height: .85; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.big small { font-size: .32em; color: var(--dim); letter-spacing: 0; }
.tier { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 118%; text-transform: uppercase; font-size: 28px; color: var(--accent); }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.row .n { font-family: var(--mono); color: var(--dim); font-size: 13px; }
.row .qq { color: var(--dim); font-size: 13px; grid-column: 2; }
.row .aa { font-weight: 700; grid-column: 2; overflow-wrap: anywhere; }
.row .pp { grid-column: 3; grid-row: 1 / span 2; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .pp b { display: block; color: var(--fg); font-size: 18px; }
.blocks { display: flex; gap: 6px; }
.blocks i { flex: 1; height: 26px; background: var(--accent); transform: skewX(-9deg); opacity: var(--o, 1); }
.actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.clock { font-family: var(--mono); font-size: 13px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
.clock b { color: var(--fg); }
.toast { font-family: var(--mono); font-size: 13px; color: var(--accent); min-height: 1.3em; }
.how { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.how li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; }
.how b { font-family: var(--mono); color: var(--accent); }
footer { color: #6f6f6f; font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .reveal, .res { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="shaft">
  <header class="top">
    <h1 class="wm sm" aria-label="Elevate">EL<span style="display:contents">E</span>V<svg class="chev" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 100 L36 0 L64 0 L100 100 L74 100 L50 28 L26 100Z"/></svg>TE</h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Baseline rarity comes from a launch survey. Every player who finishes a day shifts the numbers: each live player counts for 10 survey votes.</footer>
</div>

<script>
/* ---------- CONTENT -------------------------------------------------
   Format: "Answer:weight|alias|alias". Weight = how common the answer is.
   Replace the ELEVATE roster below with your real speakers. */
const ELEVATE = { id: "elevate", cat: "Elevate", text: "Name one speaker from Elevate", a: [
  "Speaker One:120","Speaker Two:100","Speaker Three:90","Speaker Four:70","Speaker Five:60",
  "Speaker Six:40","Speaker Seven:25","Speaker Eight:12","Speaker Nine:6","Speaker Ten:3"] };

const BANK = [
 { id:"sa", cat:"Geography", text:"Name a country in South America", a:["Brazil:260","Argentina:210","Chile:110","Colombia:100","Peru:90","Venezuela:50","Ecuador:40","Bolivia:35","Uruguay:25","Paraguay:22","Guyana:5","Suriname:3"] },
 { id:"red", cat:"Food", text:"Name a fruit that is red", a:["Strawberry:250","Apple:220","Cherry:120","Raspberry:80","Watermelon:70","Pomegranate:45","Tomato:40","Cranberry:40","Grape:30|red grape","Blood Orange:12","Dragon Fruit:8","Redcurrant:6|red currant","Persimmon:4","Goji Berry:3|goji","Lingonberry:3"] },
 { id:"code", cat:"Tech", text:"Name a programming language", a:["Python:250","JavaScript:220|js","Java:140","C++:90|cpp","C:70","C#:60|csharp|c sharp","PHP:40","Swift:30","Ruby:25","Go:25|golang","TypeScript:20|ts","Rust:15","Kotlin:15","Perl:5","Haskell:3","COBOL:3","Lisp:2","Fortran:2","Elixir:2","Brainfuck:1"] },
 { id:"pixar", cat:"Film", text:"Name a Pixar movie", a:["Toy Story:260","Finding Nemo:150","Up:100","Inside Out:90","Cars:80","Monsters Inc:80|monsters, inc|monsters","The Incredibles:60|incredibles","Coco:40","Ratatouille:35","WALL-E:35|wall e|walle","Brave:15","A Bug's Life:12|bugs life","Soul:8","Luca:6","Onward:4","Turning Red:4","The Good Dinosaur:3","Elemental:3","Lightyear:2"] },
 { id:"dog", cat:"Animals", text:"Name a dog breed", a:["Labrador:180|lab|labrador retriever","Golden Retriever:160|golden","German Shepherd:110|alsatian","Poodle:90","Bulldog:80","Beagle:70","Chihuahua:60","Pug:50","Husky:50|siberian husky","Corgi:40|welsh corgi","Dachshund:40|sausage dog","Rottweiler:30","Dalmatian:25","Boxer:20","Border Collie:15","Shih Tzu:12","Great Dane:10","Pomeranian:8","Basenji:2","Xoloitzcuintli:1"] },
 { id:"mtn", cat:"Geography", text:"Name a mountain", a:["Everest:380|mount everest","K2:80","Kilimanjaro:80|mount kilimanjaro","Fuji:60|mount fuji","Matterhorn:60","Mont Blanc:40","Mount Rushmore:40|rushmore","Denali:30|mount mckinley|mckinley","Olympus:25|mount olympus","Kosciuszko:20|mount kosciuszko","Ben Nevis:15","Aconcagua:15","Table Mountain:15","Annapurna:10","Etna:8|mount etna","Vesuvius:8|mount vesuvius","Elbrus:5","Lhotse:5","Kangchenjunga:4","Vinson:2|mount vinson","Cho Oyu:2"] },
 { id:"coffee", cat:"Food", text:"Name a coffee drink", a:["Latte:250","Cappuccino:200","Espresso:150","Americano:90","Flat White:80","Mocha:80","Macchiato:50","Cold Brew:25","Frappuccino:20","Affogato:12","Cortado:12","Long Black:10","Irish Coffee:8","Turkish Coffee:6","Piccolo:5","Ristretto:4","Doppio:3","Lungo:3","Red Eye:2"] },
 { id:"planet", cat:"Space", text:"Name a planet", a:["Mars:230","Jupiter:150","Saturn:150","Venus:120","Earth:110","Mercury:90","Neptune:70","Uranus:60","Pluto:20"] },
 { id:"inst", cat:"Music", text:"Name a musical instrument", a:["Guitar:250","Piano:220","Drums:140","Violin:100","Flute:60","Saxophone:40|sax","Trumpet:40","Clarinet:25","Cello:20","Harp:15","Bass:15|bass guitar","Ukulele:15","Trombone:12","Banjo:10","Oboe:8","Accordion:8","Harmonica:8","Xylophone:8","Tuba:6","Bassoon:4","Sitar:4","Didgeridoo:4","Theremin:3","Kazoo:2","Hurdy-Gurdy:1"] },
 { id:"bard", cat:"Books", text:"Name a Shakespeare play", a:["Hamlet:280","Romeo and Juliet:270|romeo & juliet|romeo juliet","Macbeth:200","Othello:60","King Lear:50|lear","A Midsummer Night's Dream:50|midsummer nights dream|midsummer night's dream","The Tempest:40|tempest","Much Ado About Nothing:15","Twelfth Night:10","Julius Caesar:10","The Merchant of Venice:8|merchant of venice","As You Like It:5","Richard III:4|richard 3","Coriolanus:1","Titus Andronicus:1","Cymbeline:1","Timon of Athens:1"] },
 { id:"pasta", cat:"Food", text:"Name a pasta shape", a:["Spaghetti:260","Penne:150","Lasagne:90|lasagna","Fusilli:80","Macaroni:80","Farfalle:60|bow tie|bowtie","Fettuccine:60","Linguine:50","Tagliatelle:40","Rigatoni:30","Ravioli:30","Tortellini:25","Orzo:15","Gnocchi:10","Pappardelle:8","Bucatini:8","Orecchiette:6","Cavatappi:2","Paccheri:1","Strozzapreti:1","Trofie:1"] },
 { id:"oly", cat:"Sport", text:"Name an Olympic sport", a:["Swimming:160","Athletics:140|track and field|running|track","Gymnastics:110","Basketball:70","Football:60|soccer","Tennis:50","Cycling:50","Boxing:40","Rowing:30","Archery:30","Fencing:25","Skiing:25","Weightlifting:20","Diving:20","Wrestling:20","Volleyball:18","Judo:15","Skateboarding:15","Curling:12","Golf:12","Surfing:12","Table Tennis:12|ping pong","Badminton:10","Hockey:10","Water Polo:8","Rugby:8","Sport Climbing:6|climbing","Taekwondo:6","Triathlon:6","Equestrian:6","Biathlon:4","Skeleton:3","Trampoline:2","Breaking:2|breakdancing"] }
];

/* ---------- helpers ------------------------------------------------ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/&/g, "and").replace(/[^a-z0-9]+/g, "");
const CHEV = '<svg class="chev" viewBox="0 0 100 100" aria-hidden="true"><path d="M0 100 L36 0 L64 0 L100 100 L74 100 L50 28 L26 100Z"/></svg>';

function parseQ(q) {
  return { ...q, items: q.a.map(s => {
    const [head, ...al] = s.split("|"); const i = head.lastIndexOf(":");
    const name = head.slice(0, i), w = +head.slice(i + 1);
    return { name, w, keys: [name, ...al].map(norm) };
  }) };
}
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    p = c; }
  return p[n];
}
function matchAnswer(q, raw) {
  const k = norm(raw); if (!k) return null;
  for (const it of q.items) if (it.keys.includes(k)) return it;
  if (k.length >= 5) {
    const tol = k.length >= 9 ? 2 : 1; let best = null, bd = 9;
    for (const it of q.items) for (const key of it.keys) { const d = lev(k, key); if (d < bd) { bd = d; best = it; } }
    if (bd <= tol) return best;
  }
  return null;
}

/* ---------- the day ------------------------------------------------ */
const EPOCH = Date.UTC(2026, 10, 18);
const now = new Date();
const dayN = Math.floor((Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - EPOCH) / 864e5);
const DATE = now.toISOString().slice(0, 10);
const PUZZLE = Math.max(1, dayN + 1);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function todaysQuestions() {
  const n = Math.max(0, dayN), per = 4, cycleLen = Math.ceil(BANK.length / per);
  const r = rng(1000 + Math.floor(n / cycleLen)); const idx = BANK.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const pos = n % cycleLen; const pick = [];
  for (let k = 0; k < per; k++) pick.push(idx[(pos * per + k) % idx.length]);
  return [ELEVATE, ...pick.map(i => BANK[i])].map(parseQ);
}
const QS = todaysQuestions();

/* ---------- state -------------------------------------------------- */
const LIVE_W = 10;
let live = {};          // qid -> { name: players }
let liveScores = [];    // totals of finished players today
let livePlayers = 0;
let dbState = "connecting"; // connecting | live | offline
let state = { answers: [] };  // [{q, a, pct, pts}]
let stage = "intro";     // intro | ask | reveal | done
let uid = null, db = null, toast = "";

const LS = "elevate-rarest:" + DATE;
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } };
const lsSet = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };
const saved = lsGet(); if (saved && Array.isArray(saved.answers)) state = saved;

function dist(q) {
  const lv = live[q.id] || {};
  const rows = q.items.map(it => ({ name: it.name, w: it.w + LIVE_W * (lv[it.name] || 0) }));
  const total = rows.reduce((s, r) => s + r.w, 0);
  rows.forEach(r => r.pct = r.w / total * 100);
  return rows.sort((a, b) => b.pct - a.pct);
}
const ptsFor = pct => Math.round(100 * (1 - Math.sqrt(pct / 100)));
const total = () => state.answers.reduce((s, a) => s + a.pts, 0);
/* Five rarities, most common first. `max` = share of players (%) below which an answer sits in that tier. */
const RARITIES = [
  { name: "Common",       max: Infinity }, // 20%+
  { name: "Elevate Go-er", max: 20 },      // 8-20%
  { name: "Backstage",    max: 8 },        // 3-8%
  { name: "Headliner",    max: 3 },        // 1-3%
  { name: "Keynote",      max: 1 }         // under 1%
];
const rarityIdx = pct => pct < 1 ? 4 : pct < 3 ? 3 : pct < 8 ? 2 : pct < 20 ? 1 : 0;
const label = pct => RARITIES[rarityIdx(pct)].name;
const pips = pct => `<span class="pips" aria-hidden="true">${[0,1,2,3,4].map(i => `<i class="${i <= rarityIdx(pct) ? "on" : ""}"></i>`).join("")}</span>`;
const tierOf = t => t >= 450 ? "Rooftop" : t >= 400 ? "Top Floor" : t >= 330 ? "Sky Lobby" : t >= 250 ? "Mid-Rise" : t >= 150 ? "Mezzanine" : "Lobby";

/* ---------- live data (shared rarity) ------------------------------ */
let writeChain = Promise.resolve();
function persist() {
  lsSet(state);
  if (!db || !uid) return;
  const body = { answers: state.answers, total: total(), done: state.answers.length === QS.length };
  writeChain = writeChain.then(async () => {
    try {
      const ref = db.collection("plays").doc(uid);
      const snap = await ref.get(); const cur = snap.exists ? (snap.data().days || {}) : {};
      cur[DATE] = body;
      const keep = Object.keys(cur).sort().slice(-60); const days = {}; keep.forEach(k => days[k] = cur[k]);
      await ref.set({ days });
    } catch (e) { /* the game keeps working locally */ }
  });
}
function ingest(snap) {
  const l = {}; const sc = []; let players = 0;
  snap.docs.forEach(d => {
    const day = d.data()?.days?.[DATE]; if (!day || !Array.isArray(day.answers)) return;
    players++;
    day.answers.forEach(a => { (l[a.q] = l[a.q] || {}); l[a.q][a.a] = (l[a.q][a.a] || 0) + 1; });
    if (day.done) sc.push(day.total);
    if (d.id === uid && day.answers.length > state.answers.length) { state = { answers: day.answers }; lsSet(state); }
  });
  live = l; liveScores = sc; livePlayers = players; dbState = "live";
  if (stage === "intro" && state.answers.length >= QS.length) stage = "done";
  render();
}
async function connect() {
  let timer = setTimeout(() => { if (dbState === "connecting") { dbState = "offline"; renderMeta(); } }, 10000);
  try {
    const user = await claude.use("user"); db = await claude.use("db");
    if (!db || !user) { dbState = "offline"; renderMeta(); return; }
    uid = await user.id();
    if (!uid) { db = null; dbState = "offline"; renderMeta(); return; }
    db.collection("plays").onSnapshot(s => { clearTimeout(timer); ingest(s); }, () => { dbState = "offline"; renderMeta(); });
  } catch { dbState = "offline"; renderMeta(); }
}

/* ---------- render -------------------------------------------------- */
function renderMeta() {
  const s = dbState === "live" ? `${livePlayers} playing today` : dbState === "offline" ? "Solo mode" : "Connecting";
  $("#meta").innerHTML = `Daily <b>No. ${PUZZLE}</b><br>${esc(DATE)} · ${esc(s)}`;
}
function floors(cur, revealed) {
  return `<div class="floors" role="img" aria-label="Question ${cur + 1} of ${QS.length}">` + QS.map((_, i) =>
    `<div class="floor ${i < cur || (i === cur && revealed) ? "done" : i === cur ? "here" : ""}"><span>${i + 1}</span></div>`).join("") + "</div>";
}
function untilReset() {
  const t = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1) - Date.now();
  const h = Math.max(0, Math.floor(t / 36e5)), m = Math.max(0, Math.floor(t % 36e5 / 6e4)), s = Math.max(0, Math.floor(t % 6e4 / 1e3));
  return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
}

function render() {
  renderMeta();
  const app = $("#app");
  if (state.answers.length >= QS.length && stage !== "reveal") stage = "done";
  if (stage === "intro") {
    const started = state.answers.length > 0;
    app.innerHTML = `<div class="res" style="display:flex;flex-direction:column;gap:26px">
      <div style="display:flex;flex-direction:column;gap:14px">
        <p class="eyebrow">Daily No. ${PUZZLE}</p>
        <h2 class="wm xl" aria-label="Rarest">R${CHEV}REST</h2>
      </div>
      <p class="lead">Five questions. Pick the answer almost nobody else picks. The rarer your answer, the higher you ride.</p>
      <ol class="how">
        <li><b>01</b><span>Type any answer. If it is not on the board, it does not count and you can try again.</span></li>
        <li><b>02</b><span>Your answer scores by how few players chose it. A 1% answer beats a 30% one.</span></li>
        <li><b>03</b><span>One run per day. Questions change at 00:00 UTC.</span></li>
      </ol>
      <button class="btn" id="go"><span>${started ? "Resume run" : "Take the lift"}</span></button></div>`;
    $("#go").onclick = () => { stage = "ask"; render(); };
  } else if (stage === "ask") askView(); else if (stage === "reveal") revealView(); else doneView();
}

function askView(msg = "", val = "") {
  const i = state.answers.length, q = QS[i];
  $("#app").innerHTML = `<div class="ask">
    ${floors(i, false)}
    <p class="eyebrow">${esc(q.cat)} · Floor ${i + 1}</p>
    <h2 class="q">${esc(q.text)}</h2>
    <form class="field" id="f" autocomplete="off">
      <input id="ans" type="text" placeholder="Type your answer" maxlength="60" aria-label="Your answer" autocapitalize="words" spellcheck="false" value="${esc(val)}">
      <button class="btn" type="submit"><span>Lock in</span></button>
    </form>
    <p class="note" id="note" role="alert">${esc(msg)}</p>
    <p class="hint">One answer per floor. You cannot change it once locked.</p></div>`;
  const inp = $("#ans"); inp.focus();
  $("#f").onsubmit = e => {
    e.preventDefault();
    const hit = matchAnswer(q, inp.value);
    if (!hit) { $("#note").textContent = "That one is not on the board. Try another answer."; return; }
    const row = dist(q).find(r => r.name === hit.name);
    state.answers.push({ q: q.id, a: hit.name, pct: +row.pct.toFixed(2), pts: ptsFor(row.pct) });
    persist(); stage = "reveal"; render();
  };
}

function revealView() {
  const i = state.answers.length - 1, q = QS[i], a = state.answers[i], d = dist(q);
  const top = d.slice(0, 6), inTop = top.some(r => r.name === a.a), max = top[0].pct;
  const li = r => `<li class="${r.name === a.a ? "me" : ""}"><span class="nm">${esc(r.name)}</span><span class="pc">${r.pct.toFixed(1)}%</span><div class="track"><div class="fill" style="width:${Math.max(1.5, r.pct / max * 100)}%"></div></div></li>`;
  const mine = d.find(r => r.name === a.a);
  const oneIn = a.pct > 0 ? Math.round(100 / a.pct) : 0;
  const last = i === QS.length - 1;
  $("#app").innerHTML = `<div class="reveal">
    ${floors(i, true)}
    <p class="eyebrow">${esc(q.text)}</p>
    <div class="verdict"><div><span class="tag">${label(a.pct)}</span>${pips(a.pct)}<div class="you">${esc(a.a)}</div></div><div class="pts">+${a.pts} pts · 1 in ${oneIn}</div></div>
    <ul class="bars" aria-label="How players answered">${top.map(li).join("")}${inTop ? "" : `<li class="gap" style="display:block">···</li>` + li(mine)}</ul>
    <button class="btn" id="nx"><span>${last ? "Reach the roof" : "Next floor"}</span></button></div>`;
  $("#nx").onclick = () => { stage = last ? "done" : "ask"; render(); $("#app").scrollIntoView({ block: "start" }); };
  $("#nx").focus();
}

function shareText() {
  const sq = state.answers.map(a => ["⬛", "⬜", "🟨", "🟧", "🟥"][rarityIdx(a.pct)]).join("");
  return `ELEVATE RAREST No. ${PUZZLE}\n${total()}/${QS.length * 100} · ${tierOf(total())}\n${sq}`;
}
function doneView() {
  const t = total(), beat = liveScores.length > 1 ? Math.round(liveScores.filter(s => s < t).length / liveScores.length * 100) : null;
  $("#app").innerHTML = `<div class="res" style="display:flex;flex-direction:column;gap:24px">
    ${floors(QS.length - 1, true)}
    <div class="score"><p class="eyebrow">Daily No. ${PUZZLE} · you reached</p>
      <div class="tier">${tierOf(t)}</div>
      <div class="big">${t}<small>/${QS.length * 100}</small></div>
      ${beat !== null ? `<p class="hint">Rarer than ${beat}% of today's ${liveScores.length} finishers.</p>` : ""}</div>
    <div class="blocks" aria-hidden="true">${state.answers.map(a => `<i style="--o:${(0.3 + a.pts / 100 * 0.7).toFixed(2)}"></i>`).join("")}</div>
    <div class="rows">${state.answers.map((a, i) => `<div class="row"><span class="n">${i + 1}</span><span class="qq">${esc(QS[i].text)}</span><span class="aa">${esc(a.a)} <span class="tag" style="font-size:10px;vertical-align:middle">${label(a.pct)}</span></span><span class="pp"><b>${a.pts}</b>${a.pct.toFixed(1)}%</span></div>`).join("")}</div>
    <div class="actions"><button class="btn" id="sh"><span>Copy result</span></button><span class="clock">Next run in <b id="clk">${untilReset()}</b></span></div>
    <p class="toast" id="toast" role="status">${esc(toast)}</p></div>`;
  $("#sh").onclick = async () => {
    const txt = shareText();
    try { await navigator.clipboard.writeText(txt); toast = "Copied. Paste it anywhere."; }
    catch { toast = txt.replace(/\n/g, "  |  "); }
    $("#toast").textContent = toast;
  };
}
setInterval(() => { const c = $("#clk"); if (c) c.textContent = untilReset(); }, 1000);

if (state.answers.length >= QS.length) stage = "done";
render();
connect();
</script>
