* { box-sizing: border-box; }
html { background: var(--sky-b); }
body { margin: 0; color: var(--pg); font-family: var(--body); font-size: 17px; line-height: 1.45; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 150px; }
/* scenery: sunrise sky, drifting clouds, city skyline. Cloud tile is 320px tall (a multiple of 160px) so the ride loop is seamless. */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(to bottom, var(--sky-a) 0%, var(--sky-b) 58%, var(--sky-c) 100%); }
.bg .track { position: absolute; left: 0; right: 0; top: -1920px; height: calc(100% + 3840px); background: var(--cloud) 0 0 / 640px 320px repeat; will-change: transform; }
.bg .streaks { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; background: repeating-linear-gradient(90deg, transparent 0 61px, rgba(255,255,255,.35) 61px 63px, transparent 63px 140px); }
.bg.moving .streaks { opacity: 1; }
.bg .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: var(--city) center bottom / 800px 160px repeat-x; }
@keyframes ride { from { transform: translateY(0); } to { transform: translateY(var(--dist, 480px)); } }
.bg .track.go { animation: ride var(--dur, 1000ms) cubic-bezier(.65, 0, .25, 1) both; }
@media (prefers-reduced-motion: reduce) { .bg .track.go { animation: none; } .bg .streaks { display: none; } }
.shaft { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
p { margin: 0; }

/* wordmark */
.wm { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 125%; text-transform: uppercase; letter-spacing: -0.03em; line-height: .86; margin: 0; display: inline-flex; align-items: flex-end; color: var(--pg); }
.wm .chev { height: .8em; width: .88em; margin: 0 .01em .02em .02em; fill: var(--accent); flex: none; transform: skewX(-9deg); }
.wm.sm { font-size: 22px; }
.wm .sub { font-family: var(--mono); font-style: normal; font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent-text); margin-left: 10px; align-self: flex-end; padding-bottom: 3px; font-stretch: 100%; }
.wm.xl { font-size: clamp(50px, 15vw, 100px); color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
.wm.xl .chev { stroke: var(--ink); stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; overflow: visible; }

/* top bar */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.snd[hidden] { display: none; }
.snd { appearance: none; cursor: pointer; background: var(--card); color: var(--fg); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); font-family: var(--body); font-weight: 600; font-size: 13px; padding: 4px 13px; transition: transform .1s, box-shadow .1s; }
.snd:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.snd:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.snd[aria-pressed="false"] { opacity: .65; text-decoration: line-through; }
.metarow { display: flex; }
.meta { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--chip); color: var(--fg); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; }
.meta b { font-weight: 700; }
body[data-stage="intro"] header.top .wm { display: none; }
body[data-stage="intro"] .metarow { justify-content: center; }

/* hero (intro only) */
.hero { display: none; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; }
body[data-stage="intro"] .hero { display: flex; }
.pod { width: clamp(96px, 28vw, 128px); height: auto; overflow: visible; filter: drop-shadow(0 6px 0 rgba(27,20,17,.18)); animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 0; }
@keyframes bob { 50% { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .pod { animation: none; } }
.cable { width: 5px; height: 40px; background: var(--ink); margin: -12px 0 -34px; border-radius: 3px; }
.tagpill { display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .5em; padding: 6px 6px 6px 18px; background: var(--ink); color: #fff3e0; transform: rotate(-2deg); border-radius: 6px; box-shadow: 4px 4px 0 rgba(27,20,17,.25); }
.tagline { font-size: 21px; font-weight: 600; max-width: 22ch; text-wrap: balance; line-height: 1.2; }

/* the card */
#app { background: var(--card); color: var(--fg); border: 3px solid var(--ink); border-radius: 30px; box-shadow: 6px 9px 0 var(--ink); padding: 24px; }
@media (max-width: 480px) { #app { padding: 18px; border-radius: 26px; } }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); margin: 0; }
h2.q { font-family: var(--display); font-style: italic; font-weight: 900; font-stretch: 115%; text-transform: uppercase; font-size: clamp(27px, 7.4vw, 40px); line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead { font-size: 18px; color: var(--fg); }
.stack { display: flex; flex-direction: column; gap: 22px; }

/* buttons */
.btn { appearance: none; cursor: pointer; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink);
  font-family: var(--body); font-weight: 700; font-size: 21px; line-height: 1.1; padding: 15px 26px; transition: transform .1s, box-shadow .1s, background .12s; align-self: flex-start; }
.btn > span { display: inline-block; }
.btn:hover { background: var(--hov); transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: var(--card); color: var(--fg); }
.btn.ghost:hover { background: var(--panel); }

function todaysQuestions() {

  const last = {}; const init = rng(7); BANK.forEach(q => last[q.id] = -1 - init());
  let picks = [];
  for (let d = 0; d <= n; d++) {
    const r = rng(5000 + d);
    const ranked = BANK.map(q => ({ q, k: last[q.id] + r() * 0.5 })).sort((x, y) => x.k - y.k);
    picks = ranked.slice(0, per).map(x => x.q);

    if (!picks.some(q => q.cat === "Elevate")) {

  font(MONO, 26); x.fillStyle = "#9b9b9b"; x.textAlign = "right"; x.fillText("DAILY NO. " + PUZZLE, W - 80, 96); x.fillText(DATE, W - 80, 134); x.textAlign = "left";
  x.fillStyle = "#fff"; x.fillRect(80, 176, W - 160, 4);

  let size = 96; const rank = rankOf(t).toUpperCase(); font(DISP, size, "expanded"); while (x.measureText(rank).width > W - 160 && size > 40) { size -= 4; font(DISP, size, "expanded"); }

    const tn = TIERS[a.tier].toUpperCase(); font(MONO, 22); const tw = x.measureText(tn).width + 24, tx = 80 + Math.max(x.measureText(an).width, 0) ;
    font(MONO, 22); x.fillStyle = "#9b9b9b"; x.textAlign = "right"; x.fillText(tn, W - 240, y + 82); x.textAlign = "left";
    font(MONO, 44); x.fillStyle = a.tier === 3 ? ORANGE : "#fff"; x.textAlign = "right"; x.fillText(String(a.pts), W - 80, y + 70); x.textAlign = "left";

async function saveImage() {

  let blob; try { blob = await makeCard(); } catch { blob = null; }

  const name = `elevate-matina-rarest-${PUZZLE}.png`;
  try { const dl = await claude.use("downloads"); if (dl) { await dl.save({ filename: name, data: blob }); note.textContent = "Saved. Check your downloads."; Sfx.blip(); return; } }
  catch (e) { if (e && e.code === "declined") { note.textContent = "Save cancelled."; return; } }
  try { const f = new File([blob], name, { type: "image/png" }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); note.textContent = "Shared."; return; } }
  catch (e) { if (e && e.name === "AbortError") { note.textContent = ""; return; } }
  const url = URL.createObjectURL(blob);
  try { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); note.textContent = "Saved. Check your downloads."; Sfx.blip(); } catch {}
  $("#preview").innerHTML = `<p class="hint">If nothing downloaded, press and hold the image to save it.</p><img src="${url}" alt="Your Elevate Matina Rarest result" style="width:100%;max-width:420px;display:block;margin-top:8px">`;
}

let lastTick = Date.now(), lastSave = 0;
setInterval(() => {
  const c = $("#clk"); if (c) c.textContent = untilReset();
  const nowMs = Date.now(), dt = Math.min(nowMs - lastTick, 1000); lastTick = nowMs;
